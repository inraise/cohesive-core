basePath: /api/v1
definitions:
  auth_service.CreateUserRequest:
    properties:
      age:
        maximum: 130
        minimum: 0
        type: integer
      email:
        maxLength: 100
        minLength: 5
        type: string
      first_name:
        maxLength: 100
        minLength: 3
        type: string
      last_name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        maxLength: 100
        minLength: 10
        type: string
    required:
    - email
    - first_name
    - password
    type: object
  auth_service.LoginDTOResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
    type: object
  auth_transport_http.CreateUserResponse:
    properties:
      age:
        type: integer
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  auth_transport_http.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth_transport_http.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth_transport_http.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  core_domain.Nullable-int:
    properties:
      set:
        type: boolean
      value:
        type: integer
    type: object
  core_domain.Nullable-string:
    properties:
      set:
        type: boolean
      value:
        type: string
    type: object
  core_domain.UserPatch:
    properties:
      age:
        $ref: '#/definitions/core_domain.Nullable-int'
      email:
        $ref: '#/definitions/core_domain.Nullable-string'
      firstName:
        $ref: '#/definitions/core_domain.Nullable-string'
      lastName:
        $ref: '#/definitions/core_domain.Nullable-string'
      password:
        $ref: '#/definitions/core_domain.Nullable-string'
    type: object
  core_transport_http_response.ErrorResponse:
    properties:
      error:
        example: full error text
        type: string
      message:
        example: short msg
        type: string
    type: object
  tasks_service.CreateTaskRequest:
    properties:
      assigned_to:
        type: string
      description:
        maxLength: 2000
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - title
    type: object
  tasks_transport_http.PatchTaskRequest:
    type: object
  tasks_transport_http.TaskDTOResponse:
    properties:
      assigned_to:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      household_id:
        type: string
      id:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  users_transport_http.GetMeResponse:
    properties:
      age:
        type: integer
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  users_transport_http.PatchUserRequest:
    type: object
host: 127.0.0.1:5050
info:
  contact: {}
  description: Cohesive Application REST-API scheme
  title: Cohesive-Core
  version: "0.1"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Авторизация пользователя в системе
      parameters:
      - description: LoginUser тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth_transport_http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешная авторизация
          schema:
            $ref: '#/definitions/auth_service.LoginDTOResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Авторизация пользователя
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Выход пользователя из системы
      parameters:
      - description: LogoutUser тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth_transport_http.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный выход
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Выход пользователя
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Обновление токена авторизированного пользователя
      parameters:
      - description: RefreshToken тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth_transport_http.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Токен успешно обновлен
          schema:
            $ref: '#/definitions/auth_service.LoginDTOResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Обновление токена
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создать нового пользователя в системе
      parameters:
      - description: CreateUser тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth_service.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданный пользователь
          schema:
            $ref: '#/definitions/auth_transport_http.CreateUserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Создать пользователя
      tags:
      - auth
  /households/{id}/tasks:
    get:
      description: Получить список задач дома
      parameters:
      - description: ID дома
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список задач
          schema:
            items:
              $ref: '#/definitions/tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "404":
          description: Household not found
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Список задач
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Создать новую задачу в доме
      parameters:
      - description: ID дома
        in: path
        name: id
        required: true
        type: string
      - description: CreateTask тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tasks_service.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Задача создана
          schema:
            $ref: '#/definitions/tasks_transport_http.TaskDTOResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "404":
          description: Household not found
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Создать задачу
      tags:
      - tasks
  /households/{id}/tasks/{task_id}:
    delete:
      description: Удалить задачу по ID
      parameters:
      - description: ID дома
        in: path
        name: id
        required: true
        type: string
      - description: ID задачи
        in: path
        name: task_id
        required: true
        type: string
      responses:
        "204":
          description: Задача удалена
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Удалить задачу
      tags:
      - tasks
    get:
      description: Получить задачу по ID
      parameters:
      - description: ID дома
        in: path
        name: id
        required: true
        type: string
      - description: ID задачи
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Задача
          schema:
            $ref: '#/definitions/tasks_transport_http.TaskDTOResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Получить задачу
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Частично обновить задачу (title, description, status, assigned_to)
      parameters:
      - description: ID дома
        in: path
        name: id
        required: true
        type: string
      - description: ID задачи
        in: path
        name: task_id
        required: true
        type: string
      - description: PatchTask тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tasks_transport_http.PatchTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Задача обновлена
          schema:
            $ref: '#/definitions/tasks_transport_http.TaskDTOResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "409":
          description: Version conflict
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Обновить задачу
      tags:
      - tasks
  /users/me:
    delete:
      consumes:
      - application/json
      description: Удалить пользователя из системы
      produces:
      - application/json
      responses:
        "204":
          description: Пользователь удален
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Удалить пользователя
      tags:
      - users
    get:
      consumes:
      - application/json
      description: Получить информацио о пользователе
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь получен
          schema:
            $ref: '#/definitions/users_transport_http.GetMeResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Получить пользователя
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Обновить информацио о пользователе
      parameters:
      - description: PatchMe тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users_transport_http.PatchUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь обновлен
          schema:
            $ref: '#/definitions/core_domain.UserPatch'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_transport_http_response.ErrorResponse'
      summary: Обновить пользователя
      tags:
      - users
