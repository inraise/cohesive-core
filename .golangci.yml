version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - exhaustive
    - govet
    - ineffassign
    - misspell
    - revive
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - cohesive-core
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
